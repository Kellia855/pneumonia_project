# Round-robin load balancer in front of all API containers.
# Docker's DNS (127.0.0.11) returns one address per `api` replica; `resolve` makes nginx re-read it every
# few seconds, so `docker compose up --scale api=N` takes effect without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 200m;            # bulk uploads

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;          # /evaluate and big uploads can take a while
        proxy_send_timeout 600s;
        add_header X-Upstream $upstream_addr always;   # which container answered
    }
}
